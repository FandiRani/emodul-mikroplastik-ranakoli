<html>
<head>
<meta charset="UTF-8">
<meta name="authoring-tool" content="Adobe_Animate_CC">
<title>RANAKOLI</title>

<style>
  #animation_container {
	position:absolute;
	margin:auto;
	left:0;
	right:0;
	top:0;
	bottom:0;
  }
</style>

<script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
<script src="RANAKOLI.js"></script>

<script>
// ========================================
// GLOBAL SCRIPTS
// ========================================

createjs.Sound.registerSound("aklik.mpeg", "suaraKlik");

// ========================================
// FUNGSI SUARA KLIK
// ========================================

function bunyiKlik() {
    createjs.Sound.play("suaraKlik");
}

// ========================================
// VIDEO FRAME 108
// ========================================

var video108 = null;

function mulaiVideo108() {
    hentikanVideo108();

    video108 = document.createElement("video");

    video108.src = "video108.mp4";
    video108.loop = true;
    video108.autoplay = true;
    video108.muted = false;
    video108.playsInline = true;

    video108.style.position = "absolute";
    video108.style.width = "1280px";
    video108.style.height = "400px";
    video108.style.left = "0px";
    video108.style.top = "30px";

    // Video tidak menangkap klik
    video108.style.pointerEvents = "none";

    // Video berada di belakang Canvas
    video108.style.zIndex = "0";

    video108.controls = false;

    document.body.appendChild(video108);

    video108.currentTime = 0;

    video108.play().catch(function(error) {
        console.log("Video menunggu interaksi pengguna.");
    });
}

function hentikanVideo108() {
    if (video108) {
        video108.pause();
        video108.currentTime = 0;
        video108.remove();
        video108 = null;
    }
}

// ========================================
// DATA KUIS
// ========================================

var jawabanKuis = [
    null, null, null, null, null,
    null, null, null, null, null
];

var namaPeserta = "";
var kuisSelesai = false;

// ========================================
// SIMPAN JAWABAN
// ========================================

function simpanJawaban(nomor, jawaban) {
    jawabanKuis[nomor - 1] = jawaban;
}

// ========================================
// AMBIL JAWABAN
// ========================================

function ambilJawaban(nomor) {
    return jawabanKuis[nomor - 1];
}

// ========================================
// RESET KUIS
// ========================================

function resetKuis() {
    for (var i = 0; i < jawabanKuis.length; i++) {
        jawabanKuis[i] = null;
    }

    kuisSelesai = false;
}

// ========================================
// HAPUS SEMUA TANDA DALAM SATU SOAL
// ========================================

function hapusSemuaTanda(tombolArray) {

    for (var i = 0; i < tombolArray.length; i++) {

        var tombol = tombolArray[i];

        if (tombol && tombol.tandaPilihan) {

            tombol.removeChild(tombol.tandaPilihan);

            tombol.tandaPilihan = null;
        }
    }
}

// ========================================
// BERI TANDA PADA SATU TOMBOL
// ========================================

function beriTandaPilihan(tombol) {

    if (!tombol) {
        return;
    }

    // Jangan buat tanda ganda
    if (tombol.tandaPilihan) {
        return;
    }

    var b = tombol.getBounds();

    if (!b) {
        return;
    }

    var tanda = new createjs.Shape();

    tanda.graphics
        .setStrokeStyle(3)
        .beginStroke("#FF0000")
        .drawRect(
            b.x,
            b.y,
            b.width,
            b.height
        );

    // Tanda tidak menangkap klik
    tanda.mouseEnabled = false;
    tanda.mouseChildren = false;

    // Simpan tanda pada tombol
    tombol.tandaPilihan = tanda;

    tombol.addChild(tanda);
}

// ========================================
// EVENT CLICK TANPA DUPLIKASI
// ========================================

function pasangKlik(obj, fungsi) {

    if (!obj) {
        return;
    }

    if (obj._quizClickHandler) {

        obj.removeEventListener(
            "click",
            obj._quizClickHandler
        );
    }

    obj._quizClickHandler = fungsi;

    obj.addEventListener(
        "click",
        fungsi
    );
}

// ========================================
// BACKGROUND MUSIC
// ========================================

var musikLatar = new Audio("musik.mpeg");

musikLatar.loop = true;
musikLatar.volume = 0.3;

var musikAktif = true;
var frameMusikSebelumnya = -1;

// ========================================
// MULAI MUSIK
// ========================================

function mulaiMusik() {

    if (!musikAktif) {
        return;
    }

    // PENTING:
    // Tunggu sampai exportRoot sudah dibuat
    if (!exportRoot) {
        return;
    }

    var frameSekarang = exportRoot.currentFrame + 1;

    // Jangan hidupkan musik di Frame 108
    if (frameSekarang === 108) {
        return;
    }

    musikLatar.play().catch(function(error) {

        console.log(
            "Musik menunggu interaksi pengguna."
        );

    });
}

// ========================================
// HENTIKAN MUSIK
// ========================================

function hentikanMusik() {

    musikLatar.pause();

    musikLatar.currentTime = 0;
}

// ========================================
// OTOMATIS STOP FRAME 108
// DAN PLAY LAGI SETELAH KELUAR
// ========================================

createjs.Ticker.on("tick", function() {

    // PENTING:
    // Jangan akses currentFrame sebelum
    // exportRoot selesai dibuat.
    if (!exportRoot) {
        return;
    }

    var frameSekarang = exportRoot.currentFrame + 1;

    if (frameSekarang === frameMusikSebelumnya) {
        return;
    }

    frameMusikSebelumnya = frameSekarang;

    // ==============================
    // MASUK FRAME 108
    // ==============================

    if (frameSekarang === 108) {

        hentikanMusik();

    }

    // ==============================
    // FRAME LAIN
    // ==============================

    else {

        if (musikAktif) {

            mulaiMusik();

        }
    }
});

// ========================================
// FUNGSI ON / OFF MUSIK
// ========================================

function ubahStatusMusik() {

    if (musikAktif) {

        // MATIKAN

        musikAktif = false;

        hentikanMusik();

        if (exportRoot && exportRoot.btnmusik) {

            exportRoot.btnmusik.gotoAndStop(1);

        }

    } else {

        // NYALAKAN

        musikAktif = true;

        if (exportRoot && exportRoot.btnmusik) {

            exportRoot.btnmusik.gotoAndStop(0);

        }

        mulaiMusik();
    }
}

</script>

<script>

// ========================================
// ADOBE ANIMATE
// ========================================

var canvas,
    stage,
    exportRoot,
    anim_container,
    dom_overlay_container,
    fnStartAnimation;

// ========================================
// INIT
// ========================================

function init() {

    canvas = document.getElementById("canvas");

    anim_container =
        document.getElementById("animation_container");

    dom_overlay_container =
        document.getElementById("dom_overlay_container");

    var comp =
        AdobeAn.getComposition(
            "74C344797434274C93BCB8FD881E2F7E"
        );

    var lib = comp.getLibrary();

    var loader =
        new createjs.LoadQueue(false);

    loader.installPlugin(createjs.Sound);

    loader.addEventListener(
        "fileload",
        function(evt) {
            handleFileLoad(evt, comp);
        }
    );

    loader.addEventListener(
        "complete",
        function(evt) {
            handleComplete(evt, comp);
        }
    );

    loader.loadManifest(
        lib.properties.manifest
    );
}

// ========================================
// LOAD FILE
// ========================================

function handleFileLoad(evt, comp) {

    var images = comp.getImages();

    if (
        evt &&
        evt.item.type == "image"
    ) {

        images[evt.item.id] = evt.result;
    }
}

// ========================================
// LOAD COMPLETE
// ========================================

function handleComplete(evt, comp) {

    var lib = comp.getLibrary();

    var ss = comp.getSpriteSheet();

    var queue = evt.target;

    var ssMetadata = lib.ssMetadata;

    for (
        var i = 0;
        i < ssMetadata.length;
        i++
    ) {

        ss[ssMetadata[i].name] =
            new createjs.SpriteSheet({
                "images": [
                    queue.getResult(
                        ssMetadata[i].name
                    )
                ],
                "frames":
                    ssMetadata[i].frames
            });
    }

    // ========================================
    // BUAT EXPORT ROOT
    // ========================================

    exportRoot = new lib.modulbaru();

    stage = new lib.Stage(canvas);

    stage.enableMouseOver();

    // ========================================
    // MULAI ANIMASI
    // ========================================

    fnStartAnimation = function() {

        stage.addChild(exportRoot);

        createjs.Ticker.framerate =
            lib.properties.fps;

        createjs.Ticker.addEventListener(
            "tick",
            stage
        );
    };

    // ========================================
    // RESPONSIVE
    // ========================================

    AdobeAn.makeResponsive(
        true,
        'both',
        true,
        1,
        [
            canvas,
            anim_container,
            dom_overlay_container
        ]
    );

    AdobeAn.compositionLoaded(
        lib.properties.id
    );

    fnStartAnimation();
}

// ========================================
// PLAY SOUND
// ========================================

function playSound(id, loop, offset) {

    return createjs.Sound.play(
        id,
        {
            'interrupt':
                createjs.Sound.INTERRUPT_EARLY,

            'loop':
                loop,

            'offset':
                offset
        }
    );
}

</script>

</head>

<body onload="init();" style="margin:0px;">

    <div
        id="animation_container"
        style="
            background-color:rgba(255,255,255,1.00);
            width:1280px;
            height:720px;
        "
    >

        <canvas
            id="canvas"
            width="1280"
            height="720"
            style="
                position:absolute;
                display:block;
                background-color:rgba(255,255,255,1.00);
            "
        ></canvas>

        <div
            id="dom_overlay_container"
            style="
                pointer-events:none;
                overflow:hidden;
                width:1280px;
                height:720px;
                position:absolute;
                left:0px;
                top:0px;
                display:block;
            "
        ></div>

    </div>

</body>
</html>
